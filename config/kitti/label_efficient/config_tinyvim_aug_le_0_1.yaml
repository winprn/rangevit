# =============================================================================
# RangeViM – Label-Efficient 0.1% (BALViT protocol)
#
# Mirrors the BALViT skip_ratio=1000 split. With ~19,130 train scans in
# SemanticKITTI this yields only ~19 scans (0.1% of the data) — a very
# small training set; repeat_factor=10 expands the effective epoch length
# to ~190 samples by repeating scans.
# =============================================================================

# General config
num_workers: 4
id: "exp_kitti_le_0_1"
save_path: "save_rangevim_aug_le_0_1"

# MLflow config
mlflow:
  enable: true
  tracking_uri: "http://140.245.117.232:5000"
  experiment_name: "rangevim"
  run_name: "[train] rangevim_base_aug_le_0.1"
  nested: false
  log_checkpoints: false
  log_code_snapshot: false

# Data config
data:
  dataset: "SemanticKitti"
  n_classes: 20 # 19 + 1(ignored)
  data_root: "../dataset/SemanticKitti/data_odometry_velodyne/dataset/sequences"
  has_label: true
  use_trainval: false
  # BALViT-style two-level skip.
  #   skip_ratio=1000 -> JSON key "0.1pct" -> ~19 scans (0.1% of 19,130)
  # repeat_factor=10 expands the parser-selected subset by 10x to give a
  # workable epoch length without changing the actual scan count.
  dataset_skip_step_org: 1000
  dataset_skip_step: 1
  repeat_factor: 10
  label_efficient_enable: true

# Train config
training:
  val_frequency: 1
  n_epochs: 2000
  warmup_epochs: 20
  batch_size: 4
  batch_size_val: 1
  lr: 0.0004
  train_result_frequency: 100
  loss:
    focal_loss:
      type: "focal"
      gamma: 2.0
      ignore_index: 0
      weight: 1.0
    lovasz_loss:
      weight: 1.0
    boundary_loss:
      weight: 0.0
    aux_loss:
      weight: 0.3
  save_epochs_at: []

# Model config
model:
  vit_backbone: "tinyvim_base"
  in_channels: 5
  patch_size: [2, 2]
  patch_stride: [2, 2]
  image_size: [64, 2048]
  window_size: [64, 2048]
  window_stride: [64, 2048]
  original_image_size: [64, 2048]
  train_full_image: true
  use_sliding_window: false

# Decoder
decoder: "fpn"
skip_filters: 0

# 3D refiner / post-processing
point_postproc: "knn"
knn_search: 7
knn_k: 5
knn_sigma: 1.0
knn_cutoff: 1.0

# Checkpoint model
checkpoint: null

# Range image-level augmentation
range_aug: true
use_fp16: true

# Data augmentation config
augmentation:
  p_flipx: 0.
  p_flipy: 0.5
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5

adapted_augmentation:
  use_mapped_labels: false
  pointsample:
    enable: false
    num_points: 120000
    replace: false
  polarmix:
    enable: false
    prob: 0.5
    classes: [2, 3, 4, 5, 6, 7, 8]
  instance_cutmix:
    enable: false
    prob: 1.0
    instance_bank_root: "cache/instance_bank"
    classes: [2, 3, 4, 5, 6, 7, 8]
    min_points: 20
    num_to_add: [0, 2]
  clustermix:
    enable: false
    prob: 0.5
    vertical_prob: 0.5
    sector_width: 1.570796
    height_ratio: 0.5
  instance_copy:
    enable: false
    prob: 0.5
    classes: [2, 3, 4, 5, 6, 7, 8]
    max_instances_per_class: 1

sensor:
  name: "HDL64"
  type: "spherical"
  scan_proj: true
  proj_h: 64
  proj_w: 2048
  fov_up: 3.
  fov_down: -25.
  fov_left: -180
  fov_right: 180
  img_mean:
    - 12.12
    - 10.88
    - 0.23
    - -1.04
    - 0.21
  img_stds:
    - 12.32
    - 11.47
    - 6.91
    - 0.86
    - 0.16
