# Configuration for RangeViT with Swin Transformer on SemanticKITTI
# Based on Swin-Tiny with optimizations for range images

# General config
num_workers: 4
id: 'exp_kitti_swin'

# Data config
dataset: 'SemanticKitti'
n_classes: 20 # 19 + 1(ignored)
use_trainval: false # set to true if you want to train on train-val of SemanticKITTI

# Train config
has_label: true
val_frequency: 1
n_epochs: 60
warmup_epochs: 10
batch_size: 4
batch_size_val: 1
lr: 0.0004  # Same as ViT, may need adjustment for Swin
train_result_frequency: 100

# Model config - Swin Transformer
vit_backbone: 'swin_tiny_patch4_window7_224'  # Use Swin-Tiny instead of ViT
in_channels: 5
patch_size: [2, 8]  # Keep range-image optimized patch size
patch_stride: [2, 8]
image_size: [64, 384]  # Training crop size - ensure divisible by 32 for Swin compatibility
window_size: [64, 384]  # Sliding window size
window_stride: [64, 256]  # Sliding window stride
original_image_size: [64, 2048]

# Stem - Keep ConvStem for range image preprocessing
conv_stem: 'ConvStem'  # ConvStem works well with range images
stem_base_channels: 32
D_h: 128  # Hidden dimension of the stem (optimized for SemanticKITTI)
# Note: The test results in the paper used D_h = 256, but D_h = 128 gave better validation results

# Decoder
decoder: 'up_conv'  # Use up_conv decoder for better performance
skip_filters: 0  # No skip connection for Swin (Swin doesn't provide ConvStem skip)

# 3D refiner
use_kpconv: true

# Checkpoint model
checkpoint: null
pretrained_model: './pretrained_model/swin_tiny_patch4_window7_224_22kto1k_finetune.pth'

# Swin-specific weight loading settings
reuse_pos_emb: false  # Swin uses relative positional bias, not absolute pos_embed
reuse_patch_emb: false  # ConvStem handles input channels, no patch embedding reuse

# Data augmentation config (same as ViT)
augmentation:
  # flip
  p_flipx: 0.
  p_flipy: 0.5

  # translation
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.

  # rotation
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5

# Sensor config (same as ViT)
sensor:
  name: 'HDL64'
  type: 'spherical'
  scan_proj: true
  proj_h: 64
  proj_w: 2048
  fov_up: 3.
  fov_down: -25.
  fov_left: -180
  fov_right: 180
  img_mean:
    - 12.12
    - 10.88
    - 0.23
    - -1.04
    - 0.21
  img_stds:
    - 12.32
    - 11.47
    - 6.91
    - 0.86
    - 0.16