# General config
num_workers: 4
id: 'exp_kitti_swin'

# Data config
dataset: 'SemanticKitti'
n_classes: 20   # 19 + 1 (ignored)
use_trainval: false

# Train config
has_label: true
val_frequency: 1
n_epochs: 60
warmup_epochs: 10
batch_size: 32
batch_size_val: 8
lr: 0.0004
train_result_frequency: 100

# Model config
vit_backbone: 'swin_tiny_patch4_window7_224'   # switched from ViT to Swin
in_channels: 5
image_size: [64, 384]        # random crop at train
window_size: [64, 384]       # sliding window size
window_stride: [64, 256]     # sliding window stride
original_image_size: [64, 2048]

# Note: patch_size/patch_stride not used by Swin, but safe to keep
patch_size: [2, 8]
patch_stride: [2, 8]

# Stem
conv_stem: 'ConvStem'
stem_base_channels: 32
D_h: 128   # hidden dimension of the stem

# Decoder
decoder: 'up_conv'
skip_filters: 128

# 3D refiner
use_kpconv: true

# Checkpoint model
checkpoint: null
pretrained_model: null   # set to Swin pretrained .pth if available

# Loading pre-trained patch and positional embeddings
reuse_pos_emb: false   # not relevant for Swin
reuse_patch_emb: false

# Data augmentation config
augmentation:
  # flip
  p_flipx: 0.
  p_flipy: 0.5

  # translation
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.

  # rotation
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5

sensor:
  name: 'HDL64'
  type: 'spherical'
  scan_proj: true
  proj_h: 64
  proj_w: 2048
  fov_up: 3.
  fov_down: -25.
  fov_left: -180
  fov_right: 180
  img_mean:
    - 12.12
    - 10.88
    - 0.23
    - -1.04
    - 0.21
  img_stds:
    - 12.32
    - 11.47
    - 6.91
    - 0.86
    - 0.16
