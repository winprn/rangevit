# config_fusion_kitti.yaml
# RangeViT-Fusion configuration for SemanticKITTI

# General config
num_workers: 4
id: 'rangevit_fusion_kitti'

# MLflow config
mlflow:
  enable: true
  tracking_uri: "http://140.245.117.232:5000" # e.g. 'file:./mlruns' or an HTTP URL
  experiment_name: "rangevit"
  run_name: null # defaults to the CLI-provided id when null
  nested: false
  log_checkpoints: false
  log_code_snapshot: false

# Data config
dataset: 'SemanticKitti'
n_classes: 20  # 19 + 1 (ignored)
use_trainval: false  # set to true if you want to train on train-val of SemanticKITTI

# Train config
has_label: true
val_frequency: 1
n_epochs: 60
warmup_epochs: 5
batch_size: 4
batch_size_val: 1
lr: 0.0004
train_result_frequency: 100

# Model config
model_type: 'fusion'  # 'fusion' or 'original'
vit_backbone: 'vit_base_patch16_384'
in_channels: 5
patch_size: [2, 8]
patch_stride: [2, 8]
image_size: [64, 768]
window_size: [64, 768]
window_stride: [64, 256]
original_image_size: [64, 2048]

# Stem config
conv_stem: 'ConvStem'
stem_base_channels: 32
D_h: 128

# Fusion config
fusion:
  enabled: true
  fusion_blocks: [4, 8, 12]
  aux_loss_weight: 0.4

# Decoder - not used in fusion model
decoder: 'none'
skip_filters: 0

# 3D refiner - not used in fusion model
use_kpconv: false

# Checkpoint
checkpoint: null
pretrained_model: 'timmImageNet21k'

# Pre-trained embeddings
reuse_pos_emb: true
reuse_patch_emb: false

# Data augmentation (same as original)
augmentation:
  p_flipx: 0.
  p_flipy: 0.5
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5

# Sensor config (SemanticKITTI specific)
sensor:
  name: 'HDL64'
  type: 'spherical'
  scan_proj: true
  proj_h: 64
  proj_w: 2048
  fov_up: 3.
  fov_down: -25.
  fov_left: -180
  fov_right: 180
  img_mean:
    - 12.12
    - 10.88
    - 0.23
    - -1.04
    - 0.21
  img_stds:
    - 12.32
    - 11.47
    - 6.91
    - 0.86
    - 0.16
