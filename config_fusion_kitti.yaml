# config_fusion_kitti.yaml
# RangeViT-Fusion configuration for SemanticKITTI

# General config
num_workers: 4
id: 'rangevit_fusion_kitti'

# MLflow config
mlflow:
  enable: true
  tracking_uri: "http://140.245.117.232:5000" # e.g. 'file:./mlruns' or an HTTP URL
  experiment_name: "rangevit"
  run_name: null # defaults to the CLI-provided id when null
  nested: false
  log_checkpoints: false
  log_code_snapshot: false

# Data config
dataset: 'SemanticKitti'
n_classes: 20  # 19 + 1 (ignored)
use_trainval: false  # set to true if you want to train on train-val of SemanticKITTI

# Train config
has_label: true
val_frequency: 1
n_epochs: 60
warmup_epochs: 5
batch_size: 4
batch_size_val: 1
lr: 0.0004
train_result_frequency: 100

# Model config
model_type: 'fusion'  # 'fusion' or 'original'
vit_backbone: 'vit_base_patch16_384'
in_channels: 5
patch_size: [2, 8]
patch_stride: [2, 8]
image_size: [64, 768]
window_size: [64, 768]
window_stride: [64, 256]
original_image_size: [64, 2048]

# Stem config
conv_stem: 'ConvStem'
stem_base_channels: 32
D_h: 256  # Hidden dim for ConvStem and decoder output (try 256 for richer features)

# Fusion config
fusion:
  enabled: true
  fusion_blocks: [4, 8, 12]
  aux_loss_weight: 0.0  # Disabled - using decoder instead

# Decoder config - used for upsampling to full resolution
decoder: 'up_conv'
skip_filters: 256  # Must match D_h

# 3D refiner - not used in fusion model
use_kpconv: false

# Checkpoint
checkpoint: null
pretrained_model: 'timmImageNet21k'

# Pre-trained embeddings
reuse_pos_emb: true
reuse_patch_emb: false

# Data augmentation (same as original)
augmentation:
  p_flipx: 0.
  p_flipy: 0.5
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5

adapted_augmentation:
  # SemanticKITTI mapped class ids:
  # 0=unlabeled, 1=car, 2=bicycle, 3=motorcycle, 4=truck, 5=other-vehicle,
  # 6=person, 7=bicyclist, 8=motorcyclist, 9=road, 10=parking, 11=sidewalk,
  # 12=other-ground, 13=building, 14=fence, 15=vegetation, 16=trunk,
  # 17=terrain, 18=pole, 19=traffic-sign
  use_mapped_labels: true
  pointsample:
    enable: true
    num_points: 120000
    replace: false
  polarmix:
    enable: true
    prob: 0.5
    classes: [2, 3, 4, 5, 6, 7, 8] # bicycle, motorcycle, truck, other-vehicle, person, bicyclist, motorcyclist
  instance_cutmix:
    enable: true
    prob: 1.0
    instance_bank_root: "cache/instance_bank"
    classes: [2, 3, 4, 5, 6, 7, 8] # bicycle, motorcycle, truck, other-vehicle, person, bicyclist, motorcyclist
    min_points: 20
    num_to_add: [0, 2]
  clustermix:
    enable: true
    prob: 0.5
    vertical_prob: 0.5
    sector_width: 1.570796
    height_ratio: 0.5
  instance_copy:
    enable: true
    prob: 0.5
    classes: [2, 3, 4, 5, 6, 7, 8] # bicycle, motorcycle, truck, other-vehicle, person, bicyclist, motorcyclist
    max_instances_per_class: 1

# Sensor config (SemanticKITTI specific)
sensor:
  name: 'HDL64'
  type: 'spherical'
  scan_proj: true
  proj_h: 64
  proj_w: 2048
  fov_up: 3.
  fov_down: -25.
  fov_left: -180
  fov_right: 180
  img_mean:
    - 12.12
    - 10.88
    - 0.23
    - -1.04
    - 0.21
  img_stds:
    - 12.32
    - 11.47
    - 6.91
    - 0.86
    - 0.16
