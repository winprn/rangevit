# Configuration for RangeViT with Swin Transformer V2 on SemanticKITTI
# Adapted for SemanticKITTI dataset with Velodyne HDL-64E

# General config
num_workers: 4
id: 'exp_kitti_swin'
n_classes: 20  # 19 classes + 1 ignored for SemanticKITTI

# Data config
dataset:
  name: 'SemanticKitti'
  n_classes: 20  # Keep for compatibility
  original_image_size: [64, 2048]
  window_stride: [64, 256]
use_trainval: true  # Use both train and validation sequences for training

# Train config
has_label: true
val_frequency: 10
n_epochs: 60
warmup_epochs: 10
batch_size: 4
batch_size_val: 1
lr: 0.0006
train_result_frequency: 100

# Model config
vit_backbone: 'swin_small_patch4_window7_224'
in_channels: 5
patch_size: [4, 8]
patch_stride: [4, 8]
image_size: [64, 384]
original_image_size: [64, 2048]
window_size: 7
d_model: 96
depths: [2, 2, 18, 2]
num_heads: [3, 6, 12, 24]
mlp_ratio: 4.0
dropout: 0.0
drop_path_rate: 0.3

# Stem
conv_stem: 'ConvStem'
stem_base_channels: 32
stem_hidden_dim: 256

# Decoder
decoder: 'up_conv'
up_conv_d_decoder: 256
up_conv_scale_factor: [4, 8]
skip_filters: 256

# 3D refiner
use_kpconv: true

# Checkpoint model
checkpoint: null
pretrained_model: null
reuse_pos_emb: false
reuse_patch_emb: false

# Data augmentation config
augmentation:
  p_flipx: 0.
  p_flipy: 0.5
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5

sensor:
  name: 'Velodyne'
  type: 'spherical'
  proj_h: 64
  proj_w: 2048
  fov_up: 3.0
  fov_down: -25.0
  fov_left: -180
  fov_right: 180
  img_mean: [12.12, 10.88, 0.23, -1.04, 0.21]
  img_stds: [12.32, 11.47, 6.91, 0.86, 0.16]