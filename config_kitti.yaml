# General config
num_workers: 4
id: "exp_kitti"

# MLflow config
mlflow:
  enable: true
  tracking_uri: "http://140.245.117.232:5000" # e.g. 'file:./mlruns' or an HTTP URL
  experiment_name: "rangevit"
  run_name: null # defaults to the CLI-provided id when null
  nested: false
  log_checkpoints: false
  log_code_snapshot: false

# Data config
dataset: "SemanticKitti"
n_classes: 20 # 19 + 1(ignored)
use_trainval: false # set to true if you want to train on train-val of SemanticKITTI.

# Train config
has_label: true
val_frequency: 1
n_epochs: 60
warmup_epochs: 10
batch_size: 4
batch_size_val: 1
lr: 0.0004
train_result_frequency: 100 # printing frequency of the train results

# Voxel features config
voxel_features:
  enable: true
  voxel_size: 0.05  # 5cm resolution (matching RPVNet)
  feature_dim: 8  # Output feature channels
  encoder_type: "none"  # Phase 1: no learnable encoder, Phase 2: "mlp"
  encoder_hidden_dim: 16
  aggregation: "mean"  # Mean pooling for intensity
  include_density: true  # Add normalized density as second feature
  projection_aggregation: "depth_weighted"  # Depth-weighted averaging for voxel-to-range projection

# Model config
vit_backbone: "vit_base_patch16_384"
in_channels: 13  # 5 (range) + 8 (voxel)
patch_size: [2, 8] # patch size = patch stride if a convolutional stem (ConvStem) is used
patch_stride: [2, 8]
image_size: [64, 768] # random crop at train
window_size: [64, 768] # sliding window size
window_stride: [64, 256] # sliding window stride
original_image_size: [64, 2048]

# Stem
conv_stem: "ConvStem" # 'none' or 'ConvStem'
stem_base_channels: 32
D_h: 128 # hidden dimension of the stem
# Note tha the test results that we provide in the paper for the SemanticKITTI were with D_h = 256.
# However, in the validation set D_h = 128 gave us better mIoU results.

# Decoder
decoder: "up_conv" # 'linear' or 'up_conv'
skip_filters: 128 # has to be 0 (no skip) or D_h

# 3D refiner
use_kpconv: false  # Disabled: voxel features replace KPConv refiner

# Checkpoint model
checkpoint: null
pretrained_model: "/path_to_pretrained_model/model.pth"

# Loading pre-trained patch and positional embeddings
reuse_pos_emb: true
reuse_patch_emb: false # no patch embedding as a convolutional stem (ConvStem) is used

# Data augmentation config
augmentation:
  # flip
  p_flipx: 0.
  p_flipy: 0.5

  # translation
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.

  # rotation
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5

sensor:
  name: "HDL64"
  type: "spherical"
  scan_proj: true
  proj_h: 64
  proj_w: 2048
  fov_up: 3.
  fov_down: -25.
  fov_left: -180
  fov_right: 180
  img_mean:
    - 12.12  # range
    - 10.88  # x
    - 0.23   # y
    - -1.04  # z
    - 0.21   # intensity
    - 0.0    # voxel feature 0 (mean intensity)
    - 0.0    # voxel feature 1 (density)
    - 0.0    # voxel feature 2
    - 0.0    # voxel feature 3
    - 0.0    # voxel feature 4
    - 0.0    # voxel feature 5
    - 0.0    # voxel feature 6
    - 0.0    # voxel feature 7
  img_stds:
    - 12.32  # range
    - 11.47  # x
    - 6.91   # y
    - 0.86   # z
    - 0.16   # intensity
    - 1.0    # voxel feature 0 (will compute proper stats later)
    - 1.0    # voxel feature 1
    - 1.0    # voxel feature 2
    - 1.0    # voxel feature 3
    - 1.0    # voxel feature 4
    - 1.0    # voxel feature 5
    - 1.0    # voxel feature 6
    - 1.0    # voxel feature 7
