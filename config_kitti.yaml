# General config
num_workers: 4
id: "exp_kitti"

# MLflow config
mlflow:
  enable: true
  tracking_uri: "http://140.245.117.232:5000" # e.g. 'file:./mlruns' or an HTTP URL
  experiment_name: "rangevit"
  run_name: null # defaults to the CLI-provided id when null
  nested: false
  log_checkpoints: false
  log_code_snapshot: false

# Data config
dataset: "SemanticKitti"
n_classes: 20 # 19 + 1(ignored)
use_trainval: false # set to true if you want to train on train-val of SemanticKITTI.

# Train config
has_label: true
val_frequency: 1
n_epochs: 60
warmup_epochs: 10
batch_size: 4
batch_size_val: 1
lr: 0.0004
train_result_frequency: 100 # printing frequency of the train results

# Loss config
loss:
  type: "lenet" # 'original', 'rangevit', 'lenet'
  w_ce: 1.0
  w_lovasz: 1.5
  w_boundary: 1.0

# Model config
vit_backbone: "vit_small_patch16_384"
in_channels: 5
patch_size: [2, 8] # patch size = patch stride if a convolutional stem (ConvStem) is used
patch_stride: [2, 8]
image_size: [64, 384] # random crop at train
window_size: [64, 384] # sliding window size
window_stride: [64, 256] # sliding window stride
original_image_size: [64, 2048]

# Stem
conv_stem: "ConvStem" # 'none' or 'ConvStem'
stem_base_channels: 32
D_h: 128 # hidden dimension of the stem
# Note tha the test results that we provide in the paper for the SemanticKITTI were with D_h = 256.
# However, in the validation set D_h = 128 gave us better mIoU results.

# Decoder
decoder: "up_conv" # 'linear' or 'up_conv'
skip_filters: 128 # has to be 0 (no skip) or D_h

# 3D refiner
use_kpconv: true

# BALViT BEV branch config
use_bev: false # Enable/disable BEV branch (set to true to use BALViT-style 2D-3D adapters)
bev:
  x_range: [-50, 50] # BEV x-axis range in meters (forward direction)
  y_range: [-50, 50] # BEV y-axis range in meters (left-right direction)
  grid_size: [256, 256] # BEV grid resolution [H, W]
  channels: 8 # Number of BEV feature channels (height stats, intensity, density, occupancy)
  base_channels: 64 # Base channels for BEV encoder CNN
  num_layers: 3 # Number of layers in BEV encoder

# Cross-modal adapter config (for BALViT)
adapter_indices: null # Insert adapters after these ViT blocks, e.g., [3, 7, 11] for 12-layer ViT
adapter_mlp_ratio: 4.0 # MLP expansion ratio in adapters
freeze_vit: false # Freeze ViT backbone weights (useful for fine-tuning with adapters)

# BEV decoder config (for BALViT)
use_bev_decoder: false # Add a BEV decoder branch
bev_decoder_hidden: 128 # Hidden channels in BEV decoder
use_bev_fusion: false # Fuse range-view and BEV predictions

# Checkpoint model
checkpoint: null
pretrained_model: "pretrained_model/vit_base_patch16_384.pth"

# Loading pre-trained patch and positional embeddings
reuse_pos_emb: true
reuse_patch_emb: false # no patch embedding as a convolutional stem (ConvStem) is used

# Data augmentation config
augmentation:
  # flip
  p_flipx: 0.
  p_flipy: 0.5

  # translation
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.

  # rotation
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5

  # advance augmentation
  p_rangemix: 0.9
  p_polarmix: 0.23

  # WPD (Weighted Paste and Drop) augmentation
  # Addresses overfitting, context-reliance, and class imbalance
  use_wpd: true # Enable WPD augmentation (requires wpd_stats.yaml)
  wpd_mode: "semantic" # "semantic" or "panoptic"
  wpd_apply_rate: 0.6 # Probability of applying WPD to a batch (0.5-0.7 recommended)
  wpd_stats_path: "dataset/preprocess/wpd_stats.yaml" # Path to WPD statistics file

  # MaskRange augmentation (range-view level)
  # Overfitting prevention
  p_range_drop: 0.3 # Randomly drop rows/columns in range image
  p_range_mask: 0.3 # Randomly mask rectangular regions
  p_range_noise: 0.2 # Add Gaussian noise to range values

  # Context-reliance reduction
  p_range_shift: 0.5 # Circular shift along azimuth dimension
  p_grid_fill: 0.0 # Fill empty grid cells (disabled by default, computationally expensive)

  # Class-imbalance handling (point cloud level, applied before projection)
  p_instance_paste: 0.5 # Paste instances from other scans
  p_class_mix: 0.5 # Mix minority classes between scans

sensor:
  name: "HDL64"
  type: "spherical"
  scan_proj: false
  proj_h: 64
  proj_w: 2048
  fov_up: 3.
  fov_down: -25.
  fov_left: -180
  fov_right: 180
  img_mean:
    - 12.12
    - 10.88
    - 0.23
    - -1.04
    - 0.21
  img_stds:
    - 12.32
    - 11.47
    - 6.91
    - 0.86
    - 0.16
