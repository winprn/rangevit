# General config
num_workers: 6
id: "exp_kitti_tinyvim_crop64x1024"
save_path: "save_rangevim_"
distributed: false

# MLflow config
mlflow:
  enable: false
  tracking_uri: "http://140.245.117.232:5000" # e.g. 'file:./mlruns' or an HTTP URL
  experiment_name: "rangevim"
  run_name: "[train] base_" # defaults to the CLI-provided id when null
  nested: false
  log_checkpoints: false
  log_code_snapshot: false

# Data config
data:
  dataset: "SemanticKitti"
  n_classes: 20 # 19 + 1(ignored)
  data_root: "../dataset/SemanticKitti/data_odometry_velodyne/dataset/sequences"
  has_label: true
  use_trainval: false # set to true if you want to train on train-val of SemanticKITTI.

knni:
  enable: false
  window_size: 5
  cache: true
  cache_train: false
  cache_dir: "cache/knni"
  cache_version: "v1"

# Train config
training:
  val_frequency: 1
  n_epochs: 60
  warmup_epochs: 3
  batch_size: 1
  batch_size_val: 1
  lr: 0.0004
  min_lr: 0.000004 # cosine floor (eta_min). Keep > 0 to avoid fully freezing late training; ~1% of lr is a common start.
  use_fp16: false
  train_result_frequency: 100 # printing frequency of the train results
  loss:
    focal_loss:
      type: "class_weighted_focal" # also accepts alias: class_weight_focal
      weight: 0.1
      gamma: 1.5
      ignore_index: 0
    lovasz_loss:
      weight: 1.0
    boundary_loss:
      weight: 1.0 # only applied when use_kpconv is False
    aux_loss:
      weight: 0.1 # global auxiliary loss weight (train only)
  # Optional manual class weights (length must equal n_classes). Leave null to use dataset-derived weights.
  # class_weights: [0.0, 1.0, ...]
  save_epochs_at: [] # 1-based epochs to save checkpoints; must be < n_epochs. Leave empty to save every epoch.

# Model config
model:
  vit_backbone: "tinyvim_base"
  in_channels: 5
  image_size: [64, 1024]         # train-time crop size
  window_size: [64, 1024]        # sliding window size for validation
  window_stride: [64, 512]       # 50% overlap along width; good quality/speed trade-off
  original_image_size: [64, 2048]
  # Full-image switches
  train_full_image: false        # enable random crops during training
  use_sliding_window: true       # sliding-window inference/validation

# Decoder
decoder: "tinyvim_fuse_aux" # 'linear', 'up_conv', 'fpn', or 'tinyvim_fuse_aux' (TinyViM-only)
fuse_proj_channels: 128   # tinyvim_fuse_aux only: per-stage 1x1 projection channels (used only when fuse_preproj=true)
fuse_mid_channels: 256    # tinyvim_fuse_aux only: channels after first fusion conv (conv_1)
fuse_out_channels: 128    # tinyvim_fuse_aux only: channels after second fusion conv (conv_2); decoder feature dim
# tinyvim_fuse_aux only: controls whether stage-wise 1x1 projection is applied BEFORE spatial alignment + concat.
# - true  (default, recommended baseline):
#     each stage -> 1x1 to fuse_proj_channels -> upsample to highest-res stage -> concat -> conv_1/conv_2.
#     Benefits: balanced per-stage channel contribution, lower/fixed fusion width, usually more stable optimization.
# - false (ablation mode):
#     each stage is upsampled in original channels -> direct concat -> conv_1/conv_2 (no per-stage 1x1 pre-proj).
#     Effects: larger concat width (TinyViM-B: 48+96+192+384=720), more memory/compute in conv_1, may emphasize deep stages.
#     Use this for experiments; quality can improve or degrade depending on training recipe and regularization.
# Notes:
# - aux heads still work in both modes; when false, aux heads consume raw stage channels after alignment.
# - If switching to false, keep all else fixed for fair ablation, then retune lr/aux_loss_weight only if needed.
fuse_preproj: true
aux_enable: true          # tinyvim_fuse_aux only: enable 3 auxiliary heads (train-time supervision, ignored at inference)

# 3D refiner / post-processing
point_postproc: "knn" # 'kpconv', 'knn', or 'none'; overrides the boolean flags below
knn_search: 13
knn_k: 5
knn_sigma: 1.0
knn_cutoff: 1.0

# Checkpoint model
checkpoint: null
pretrained_model: null  # Set to "/path/to/tinyvim_imagenet1k.pth" when using pretrained weights
# Loading pre-trained patch and positional embeddings
reuse_pos_emb: false
reuse_patch_emb: false # no patch embedding as a convolutional stem (ConvStem) is used

# Channel adaptation method for RGB (3-ch) -> LiDAR (5-ch) pretrained weights
# Options:
#   - 'repeat': [R,G,B] -> [R,G,B,R,G] x (3/5) - Default, preserves RGB info
#   - 'grayscale': RGB -> Luminance -> [G,G,G,G,G] - Uses ITU-R BT.601 weights
pretrained_channel_adaptation: "repeat"

# Data augmentation config
augmentation:
  # flip
  p_flipx: 0.
  p_flipy: 0.5

  # translation
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.

  # rotation
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5

adapted_augmentation:
  # SemanticKITTI mapped class ids:
  # 0=unlabeled, 1=car, 2=bicycle, 3=motorcycle, 4=truck, 5=other-vehicle,
  # 6=person, 7=bicyclist, 8=motorcyclist, 9=road, 10=parking, 11=sidewalk,
  # 12=other-ground, 13=building, 14=fence, 15=vegetation, 16=trunk,
  # 17=terrain, 18=pole, 19=traffic-sign
  use_mapped_labels: true
  pointsample:
    enable: false
    num_points: 120000
    replace: false
  polarmix:
    enable: true
    prob: 0.6
    classes: [2, 3, 4, 5, 6, 7, 8, 10] # bicycle, motorcycle, truck, other-vehicle, person, bicyclist, motorcyclist
  instance_cutmix:
    enable: true
    prob: 1.0
    instance_bank_root: "cache/instance_bank"
    classes: [2, 3, 4, 5, 6, 7, 8, 10] # bicycle, motorcycle, truck, other-vehicle, person, bicyclist, motorcyclist
    min_points: 20
    num_to_add: [0, 3]
  clustermix:
    enable: true
    prob: 0.6
    vertical_prob: 0.5
    sector_width: 1.570796
    height_ratio: 0.5
  instance_copy:
    enable: true
    prob: 0.6
    classes: [2, 3, 4, 5, 6, 7, 8, 10] # bicycle, motorcycle, truck, other-vehicle, person, bicyclist, motorcyclist
    max_instances_per_class: 2

sensor:
  name: "HDL64"
  type: "spherical"
  scan_proj: true
  proj_h: 64
  proj_w: 2048
  fov_up: 3.
  fov_down: -25.
  fov_left: -180
  fov_right: 180
  img_mean:
    - 12.12
    - 10.88
    - 0.23
    - -1.04
    - 0.21
  img_stds:
    - 12.32
    - 11.47
    - 6.91
    - 0.86
    - 0.16
