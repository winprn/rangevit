# General config
num_workers: 2
id: 'test_run'

# Data config
dataset: 'SemanticKitti'
n_classes: 20 # 19 + 1(ignored)
use_trainval: false

# Train config - MINIMAL FOR TESTING
has_label: true
val_frequency: 1  # validate every epoch
n_epochs: 2  # only 2 epochs for testing
warmup_epochs: 1
batch_size: 2  # small batch size
batch_size_val: 1
lr: 0.0004
train_result_frequency: 10  # print more frequently
max_iters_per_epoch: 10  # only run 10 iterations per epoch for quick testing


# Model config
vit_backbone: 'vit_base_patch16_384'
in_channels: 5
patch_size: [2, 8]
patch_stride: [2, 8]
image_size: [64, 384]
window_size: [64, 384]
window_stride: [64, 256]
original_image_size: [64, 2048]

# Stem
conv_stem: 'ConvStem'
stem_base_channels: 32
D_h: 128

# Decoder
decoder: 'up_conv'
skip_filters: 128

# 3D refiner
use_kpconv: true


# Checkpoint model
pretrained_model: "../pretrained_model/vit_base_p16_384.pth"

# Loading pre-trained patch and positional embeddings
reuse_pos_emb: true
reuse_patch_emb: false

# Data augmentation config - DISABLED FOR TESTING
augmentation:
  # flip
  p_flipx: 0.
  p_flipy: 0.

  # translation
  p_transx: 0.
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.
  trans_zmin: -1
  trans_zmax: 0.

  # rotation
  p_rot_roll: 0.
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.
  rot_yawmin: 5
  rot_yawmax: -5

sensor:
  name: 'HDL64'
  type: 'spherical'
  scan_proj: true
  proj_h: 64
  proj_w: 2048
  fov_up: 3.
  fov_down: -25.
  fov_left: -180
  fov_right: 180
  img_mean:
    - 12.12
    - 10.88
    - 0.23
    - -1.04
    - 0.21
  img_stds:
    - 12.32
    - 11.47
    - 6.91
    - 0.86
    - 0.16
