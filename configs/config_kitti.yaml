# General config
num_workers: 4
id: 'exp_kitti'

# MLflow (optional)
mlflow:
    enabled: false
    experiment: 'rangevit'
    run_name: '[trainval] rangeformer_encoder'            # overrides default if set

# Data config
dataset: 'SemanticKitti'
n_classes: 20 # 19 + 1(ignored)
use_trainval: false # set to true if you want to train on train-val of SemanticKITTI.
data_root: "../dataset/SemanticKitti/data_odometry_velodyne/dataset/sequences"

# Train config
has_label: true
val_frequency: 3
save_frequent: 10
n_epochs: 70
warmup_epochs: 10
batch_size: 8
batch_size_val: 1
lr: 0.001
train_result_frequency: 100 # printing frequency of the train results


# Model config
model_type: 'rangeformer'
vit_backbone: 'vit_small_p16_384'
in_channels: 6
use_valid_mask: true
patch_size: [2, 8]  # patch size = patch stride if a convolutional stem (ConvStem) is used
patch_stride: [2, 8]
image_size: [64, 384]  # random crop at train
window_size: [64, 384] # sliding window size
window_stride: [64, 256] # sliding window stride
original_image_size: [64, 2048]

# Stem
conv_stem: 'ConvStem' # 'none' or 'ConvStem'
stem_base_channels: 32
D_h: 256 # hidden dimension of the stem
# Note tha the test results that we provide in the paper for the SemanticKITTI were with D_h = 256.
# However, in the validation set D_h = 128 gave us better mIoU results.

# Decoder
decoder: 'up_conv'  # 'linear' or 'up_conv'
skip_filters: 256 # has to be 0 (no skip) or D_h 

# 3D refiner
use_kpconv: false

# Checkpoint model
save_path: "save_rangeformer"
# checkpoint: null
pretrained_model: "../pretrained_model/vit_small_p16_384_ft.pth"

# Loading pre-trained patch and positional embeddings
reuse_pos_emb: true
reuse_patch_emb: false # no patch embedding as a convolutional stem (ConvStem) is used


# Data augmentation config
augmentation:
  # flip
  p_flipx: 0.
  p_flipy: 0.5

  # translation
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.

  # rotation
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5

  # RangeAug
  range_aug:
    p_mix: 0.5
    p_union: 0.5
    p_paste: 0.5
    p_shift: 0.5
    rare_classes: [11, 15, 18, 20, 30, 31, 32]

  # Post-processing (KNN)
  post_proc:
    knn: 5
    search: 5
    sigma: 1.0
    cutoff: 1.0

sensor:
  name: 'HDL64'
  type: 'spherical'
  scan_proj: true
  proj_h: 64
  proj_w: 2048
  fov_up: 3.
  fov_down: -25.
  fov_left: -180
  fov_right: 180
  img_mean:
    - 12.12
    - 10.88
    - 0.23
    - -1.04
    - 0.21
    - 0.0
  img_stds:
    - 12.32
    - 11.47
    - 6.91
    - 0.86
    - 0.16
    - 1.0
