# RangeFormer Configuration for SemanticKITTI Dataset
# Reference: Kong et al. 2023

# Experiment ID
id: 'rangeformer_base_semantickitti'

# Model architecture
model_type: 'rangeformer'  # or 'rangevit'

# RangeFormer specific settings
rangeformer:
  depths: [2, 2, 6, 2]  # Number of transformer blocks per stage
  stage_channels: [128, 128, 320, 512]  # Channel dimensions per stage
  heads: [3, 4, 6, 3]  # Number of attention heads per stage
  decoder_unify_ch: 256  # Unified channel dimension in decoder
  mlp_ratio: 4.0  # MLP expansion ratio
  aux_loss_weight: 0.4  # Weight for auxiliary losses

# Dataset
dataset: 'SemanticKITTI'
n_classes: 20  # Including ignore class
has_label: True
use_trainval: False

# Image/Range View Settings
in_channels: 6  # [x, y, z, depth, intensity, existence]
image_size: [64, 1024]  # Training crop size
original_image_size: [64, 2048]  # Full resolution (validation/test)

# Sensor configuration for range projection
sensor:
  proj_h: 64
  proj_w: 2048
  fov_up: 3.0
  fov_down: -25.0
  fov_left: -180.0
  fov_right: 180.0
  scan_proj: False  # Use angular projection (not scan-based)

  # Normalization (for 6 channels: [depth, x, y, z, intensity, existence])
  img_mean: [12.12, 0.0, 0.0, 0.0, 0.5, 0.5]
  img_stds: [12.32, 1.0, 1.0, 1.0, 0.5, 0.5]

# Training settings
n_epochs: 50
batch_size: 8  # Adjust based on GPU memory
batch_size_val: 1
lr: 0.001
warmup_epochs: 5
val_frequency: 5
train_result_frequency: 100
log_frequency: 50

# Mixed precision training
use_fp16: False

# Optimizer
weight_decay: 0.01

# Data augmentation
augmentation:
  # 3D Point Cloud Augmentations (before projection)
  p_flipx: 0.0
  p_flipy: 0.5
  trans_xmin: -5.0
  trans_xmax: 5.0
  trans_ymin: -3.0
  trans_ymax: 3.0
  trans_zmin: -1.0
  trans_zmax: 0.0
  p_transx: 0.0
  p_transy: 0.0
  p_transz: 0.0
  rot_rollmin: -5.0
  rot_rollmax: 5.0
  rot_pitchmin: -5.0
  rot_pitchmax: 5.0
  rot_yawmin: -180.0
  rot_yawmax: 180.0
  p_rot_roll: 0.0
  p_rot_pitch: 0.0
  p_rot_yaw: 0.5
  p_scale: 0.0
  scale_min: 0.95
  scale_max: 1.05

  # 2D Range Image Augmentations (RangeFormer-specific)
  use_range_aug: True
  range_aug_prob: 0.5  # Probability of applying RangeAug
  p_range_shift: 0.5
  p_range_mix: 0.3
  p_range_union: 0.2
  p_range_paste: 0.1
  range_paste_classes: [1, 2, 3, 4, 5, 6, 7, 8]  # Rare classes for RangePaste

  # Standard 2D augmentations
  p_hflip: 0.0  # Horizontal flip of range view

# Loss function
loss:
  type: 'crossentropy'  # or 'lovasz', 'focal'
  ignore_index: 0
  aux_loss_weight: 0.4  # Weight for auxiliary losses

# Checkpoint
checkpoint: null  # Path to resume from checkpoint
pretrained_model: null  # Path to pretrained weights (if any)

# Inference settings
inference:
  use_range_post: True  # Use RangePost strategy
  num_sub: 4  # Number of subclouds for RangePost
  use_knn: True  # Use KNN post-processing
  knn_params:
    k: 7
    search: 7
    sigma: 1.0
    cutoff: 2.0

# Save settings
save_frequency: 5  # Save checkpoint every N epochs
keep_checkpoints: 5  # Keep last N checkpoints
