# General config
num_workers: 4
id: "exp_kitti_segman"
data_root: "../dataset/SemanticKitti/data_odometry_velodyne/dataset/sequences"
save_path: "save_segman"

# MLflow config
mlflow:
  enable: true
  tracking_uri: "http://140.245.117.232:5000" # e.g. 'file:./mlruns' or an HTTP URL
  experiment_name: "rangevim"
  run_name: "[train] segman_kitti" # defaults to the CLI-provided id when null
  nested: false
  log_checkpoints: false
  log_code_snapshot: false

# Data config
dataset: "SemanticKitti"
n_classes: 20 # 19 + 1(ignored)
use_trainval: false # set to true if you want to train on train-val of SemanticKITTI.

# Train config
has_label: true
val_frequency: 1
n_epochs: 60
warmup_epochs: 6
batch_size: 4
batch_size_val: 1
lr: 0.0003
train_result_frequency: 100 # printing frequency of the train results
boundary_loss_weight: 0.0 # Weight for boundary mIoU loss (only applied when use_kpconv is False)
save_epochs_at: [30, 33, 35, 37, 39, 40, 41, 43, 45, 47, 50, 55] # 1-based epochs to save checkpoints; must be < n_epochs. Leave empty to save every epoch.

# Model config
encoder_backbone: "segman_s"
in_channels: 5
patch_size: [2, 2] # kept for compatibility; not used by SegMAN
patch_stride: [2, 2]
image_size: [64, 2048]         # match sensor projection; no train-time resize
window_size: [64, 2048]        # full-frame inference window; no resize/tiling
window_stride: [64, 2048]      # single window when sliding is enabled
original_image_size: [64, 2048]
# Full-image switches
train_full_image: true         # train on the full projection (no random crop or scaling)
use_sliding_window: false      # full-frame inference/validation; keeps spatial size

# Stem
conv_stem: "ConvStem" # 'none' or 'ConvStem'
stem_base_channels: 32
D_h: 48

# Decoder
decoder: "segman"
skip_filters: 0

# SegMAN config (no mmcv/mmseg dependencies)
segman:
  # Encoder variant: t/s/b/l corresponds to SegMANEncoder_t/s/b/l.
  variant: "s"
  # Keep these in sync with your SegMAN implementation.
  embed_dims: [64, 144, 288, 512]
  depths: [2, 2, 10, 4]
  num_heads: [2, 4, 8, 16]
  # Window sizes must not exceed stage resolution; H shrinks to [16, 8, 4, 2] for 64x2048 input.
  window_size: [7, 7, 3, 3]
  window_dilation: [1, 1, 1, 1]
  sr_ratio: [8, 4, 2, 1]
  mlp_ratios: [4, 4, 3.4, 3.4]
  drop_path_rate: 0.0
  use_rpb: false
  layerscales: [false, false, false, false]
  layer_init_values: 1.0e-6
  ssm_ratio: 1.0
  ssm_split: false
  fused_na: false
  pretrained: null
  # Decoder-specific
  feat_proj_dim: 256
  channel_split: false
  short_cut: false
  interpolate_mode: "bilinear"

# 3D refiner / post-processing
point_postproc: "knn" # 'kpconv', 'knn', or 'none'; overrides the boolean flags below
knn_search: 13
knn_k: 5
knn_sigma: 1.0
knn_cutoff: 1.0

# Checkpoint model
checkpoint: null
pretrained_model: null  # Set to a SegMAN-pretrained checkpoint if available
# Loading pre-trained patch and positional embeddings
reuse_pos_emb: false
reuse_patch_emb: false # no patch embedding as a convolutional stem (ConvStem) is used

# Channel adaptation method for RGB (3-ch) -> LiDAR (5-ch) pretrained weights
# Options:
#   - 'repeat': [R,G,B] -> [R,G,B,R,G] * (3/5) - Default, preserves RGB info
#   - 'grayscale': RGB -> Luminance -> [G,G,G,G,G] - Uses ITU-R BT.601 weights
pretrained_channel_adaptation: "repeat"

# Data augmentation config
augmentation:
  # flip
  p_flipx: 0.
  p_flipy: 0.5

  # translation
  p_transx: 0.5
  trans_xmin: -5
  trans_xmax: 5
  p_transy: 0.5
  trans_ymin: -3
  trans_ymax: 3
  p_transz: 0.5
  trans_zmin: -1
  trans_zmax: 0.

  # rotation
  p_rot_roll: 0.5
  rot_rollmin: -5
  rot_rollmax: 5
  p_rot_pitch: 0.5
  rot_pitchmin: -5
  rot_pitchmax: 5
  p_rot_yaw: 0.5
  rot_yawmin: 5
  rot_yawmax: -5

sensor:
  name: "HDL64"
  type: "spherical"
  scan_proj: true
  proj_h: 64
  proj_w: 2048
  fov_up: 3.
  fov_down: -25.
  fov_left: -180
  fov_right: 180
  img_mean:
    - 12.12
    - 10.88
    - 0.23
    - -1.04
    - 0.21
  img_stds:
    - 12.32
    - 11.47
    - 6.91
    - 0.86
    - 0.16
